<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice {{.InvoiceNo}}</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: #f4f4f5;
    color: #18181b;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px;
    background: #fff;
    border-bottom: 1px solid #e4e4e7;
  }
  header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 700;
  }
  header p {
    margin: 2px 0 0 0;
    font-size: 12px;
    color: #71717a;
  }
  a.download {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #d81f27;
    color: #fff;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .viewer {
    width: 100%;
    height: calc(100vh - 62px);
    border: none;
    display: block;
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Invoice {{.InvoiceNo}}</h1>
      <p>Soft copy — view or download below</p>
    </div>
    <a class="download" href="{{.PDFURL}}" download="{{.DownloadFilename}}">Download PDF</a>
  </header>
  <iframe class="viewer" src="{{.PDFURL}}" title="Invoice {{.InvoiceNo}}"></iframe>
</body>
</html>
