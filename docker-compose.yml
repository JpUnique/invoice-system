services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petrodata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petrodata}
      POSTGRES_DB: ${POSTGRES_DB:-petrodata}
    ports:
      - "${BIND_IP:-0.0.0.0}:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petrodata} -d ${POSTGRES_DB:-petrodata}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 8080
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-petrodata}:${POSTGRES_PASSWORD:-petrodata}@postgres:5432/${POSTGRES_DB:-petrodata}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${BIND_IP:-0.0.0.0}:${BACKEND_PORT:-8081}:8080"
    shm_size: "512mb"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - ./assets:/app/assets:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # Note the missing colon: falls back to the dev default only when
        # the var is entirely unset, not when it's explicitly set to ""
        # (the Caddy-fronted / relative-API-path setup — see .env.example).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-http://localhost:8081}
    restart: unless-stopped
    ports:
      - "${BIND_IP:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  # Not started by `docker compose up`. Run migrations with:
  #   docker compose --profile tools run --rm migrate up
  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["tools"]
    volumes:
      - ./backend/migrations:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database
      - postgres://${POSTGRES_USER:-petrodata}:${POSTGRES_PASSWORD:-petrodata}@postgres:5432/${POSTGRES_DB:-petrodata}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${BIND_IP:-0.0.0.0}:80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  # Optional remote access (e.g. for the MD) over a private Tailscale mesh
  # VPN. Never starts with a plain `docker compose up` — only with
  # `docker compose --profile tailscale up -d`, or `scripts/petrodata.sh
  # tailscale`. Shares Caddy's network namespace so port 80 becomes
  # reachable over the tailnet too, without any Caddyfile change and without
  # touching the existing LAN/dedicated-IP setup (both work simultaneously).
  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    environment:
      # Not a required (":?") var: compose interpolates every service's env
      # block up front regardless of profile, so a required var here would
      # break plain `docker compose up` for everyone, even those never
      # touching Tailscale. cmd_tailscale in petrodata.sh checks this is set
      # before bringing the service up; the image itself also refuses to
      # start without it.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      # Docker's own top-level `hostname:` can't be set here — it conflicts
      # with `network_mode: service:caddy` below ("conflicting options:
      # hostname and the network mode"), since sharing another container's
      # whole network namespace includes its hostname. The tailscale image
      # reads TS_HOSTNAME itself instead, which sets the name it advertises
      # on the tailnet independent of the container's OS-level hostname.
      TS_HOSTNAME: ${TS_HOSTNAME:-petrodata-invoices}
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: --accept-dns=false
    volumes:
      - tailscale_state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - NET_RAW
    profiles: ["tailscale"]
    network_mode: "service:caddy"
    depends_on:
      caddy:
        condition: service_started

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
  tailscale_state:
